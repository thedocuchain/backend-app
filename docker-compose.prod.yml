version: '3.8'
services:
  db:
    image: postgres:14
    restart: always
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - db:/var/lib/postgresql/data
  backend-app:
    container_name: backend-app
    restart: unless-stopped
    image: docuchain-backend:latest
    env_file:
      - .env-compose
    ports:
      - "3001:3001"
    depends_on:
      - db
  metabase:
    image: metabase/metabase:v0.50.15
    container_name: metabase
    hostname: metabase
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase
      - MB_DB_PORT=5432
      - MB_DB_USER=${DATABASE_USER}
      - MB_DB_PASS=${DATABASE_PASSWORD}
      - MB_DB_HOST=db
    volumes:
      - /dev/urandom:/dev/random:ro
    ports:
      - 127.0.0.1:3021:3000
    depends_on:
      - db
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  db:
